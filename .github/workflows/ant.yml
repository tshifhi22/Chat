name: Java CI (Ant)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Show environment
        run: |
          java -version
          javac -version
          ant -version || true

      - name: Build with Ant
        run: |
          if [ -f build.xml ]; then
            echo "Found build.xml — running 'ant -f build.xml'"
            ant -f build.xml
          else
            echo "No build.xml found — attempting 'ant' (default target)"
            ant
          fi
