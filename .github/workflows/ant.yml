name: Java CI with Ant

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [8, 11]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Cache Ivy (optional)
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.ivy2/.ivy2
          key: ${{ runner.os }}-ivy-${{ matrix.java-version }}-${{ hashFiles('**/build.xml') }}

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Build with Ant
        run: ant -v

      - name: Run tests (if defined in build.xml)
        run: ant test || true

      - name: Archive build artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ant-build-artifacts
          path: build || dist || out || target || ''
