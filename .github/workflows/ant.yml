name: Java CI with Ant

on:
  push:
    branches: ["main", "part2-SendingMessages"]
  pull_request:
    branches: ["main", "part2-SendingMessages"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Download JSON Simple
        run: |
          mkdir -p libs
          curl -L -o libs/json-simple-1.1.1.jar https://repo1.maven.org/maven2/com/googlecode/json-simple/json-simple/1.1.1/json-simple-1.1.1.jar

      - name: Build with Ant
        run: ant -Dlibs.json_simple.classpath=${{ github.workspace }}/libs/json-simple-1.1.1.jar -v

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ant-build-artifacts
          path: |
            build
            dist
          if-no-files-found: ignore
