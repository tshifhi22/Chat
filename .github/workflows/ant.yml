name: Java CI with Ant

on:
  push:
    branches: ["main", "part2-SendingMessages"]
  pull_request:
    branches: ["main", "part2-SendingMessages"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Download libraries
        run: |
          mkdir -p libs
          curl -L -o libs/json-simple-1.1.1.jar https://repo1.maven.org/maven2/com/googlecode/json-simple/json-simple/1.1.1/json-simple-1.1.1.jar
          curl -L -o libs/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -L -o libs/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Build with Ant
        run: |
          ant -v \
            -Dlibs.json_simple.classpath=${{ github.workspace }}/libs/json-simple-1.1.1.jar \
            -Dlibs.junit_4.classpath=${{ github.workspace }}/libs/junit-4.13.2.jar \
            -Dlibs.hamcrest.classpath=${{ github.workspace }}/libs/hamcrest-core-1.3.jar

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ant-build-artifacts
          path: |
            build
            dist
          if-no-files-found: ignore
